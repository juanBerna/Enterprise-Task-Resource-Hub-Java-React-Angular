# Configuración del Servidor y Aplicación
server.port=8080
spring.application.name=backend-core

# Habilitación de Java Virtual Threads (Proyecto Loom) - Alto rendimiento en E/S
spring.threads.virtual.enabled=true

# Configuración de Base de Datos H2 (Desarrollo Local en Memoria)
spring.datasource.url=jdbc:h2:mem:onboardingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 habilitada para inspección visual local
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de Spring Data JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de OpenAPI / Swagger UI path personalizado (opcional)
springdoc.swagger-ui.path=/swagger-ui.html

# Configuración del Servidor de Recursos OAuth2 (JWT Issuer)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-issuer.your-auth-provider.com/realms/enterprise-realm